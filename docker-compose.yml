# Optional helper: runs PostgreSQL (and, with --profile ml, the prediction service) in Docker.
# 1. Copy .env.example to .env and set POSTGRES_PASSWORD.
# 2. docker compose up -d db
# The Go backend and React frontend are still started normally (see README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a .env file next to docker-compose.yml}
      POSTGRES_DB: finance_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    profiles: ["ml"]
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8001:8001"

volumes:
  pgdata:
