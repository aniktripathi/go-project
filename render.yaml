services:
  - type: web
    name: finance-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GIN_MODE
        value: release
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: finance-tracker-web
          property: host

  - type: web
    name: finance-tracker-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: finance-tracker-api
          property: host
